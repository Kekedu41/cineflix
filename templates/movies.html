{% extends "base.html" %}
{% block title %}Cinéflix - Films{% endblock %}
{% block content %}
<div class="categories-bar">
    <a href="/movies" class="category-chip {% if current_genre is none %}active{% endif %}">🎬 Films Populaires</a>
    {% for g in movie_genres %}
        <a href="/movies?genre={{ g.id }}" class="category-chip {% if current_genre == g.id %}active{% endif %}">{{ g.name }}</a>
    {% endfor %}
</div>
<h2>{{ page_title }}</h2>
{{ movies_row | safe }}
{{ pagination_html | safe }}
{% endblock %}
